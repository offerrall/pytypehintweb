<!doctype html>
<html>
<head><meta charset="utf-8"><title>pytypehintweb browser smoke</title></head>
<body>
<!--
  A tiny real-browser smoke test. The Node suite runs against a fake DOM, so a
  few behaviours only a real browser has are unchecked there — most importantly
  that a native control keeps or loses focus, and that a native date/time/range
  input behaves as claimed. This page exercises those against the actual shipped
  modules. It adds no dependency and no build step.

  Run headless (Chromium/Chrome), capturing the verdict from the DOM, where
  $SMOKE_URL is an absolute file:// URL to this page:

    chrome --headless=new --disable-gpu --allow-file-access-from-files \
      --virtual-time-budget=8000 --dump-dom "$SMOKE_URL" | grep 'id="result"'

  Expect the #result element to read "SMOKE: PASS (N checks)". A "FAIL" line
  names the check. Read the verdict from that element, never from a bare text
  match: this comment contains the same words, so an unanchored grep would say
  PASS whatever the page did. Opening the page served over http:// works too;
  loading it as a file needs the --allow-file-access-from-files flag for the
  module imports.
-->
<div id="host"></div>
<pre id="out">running…</pre>
<div id="result">PENDING</div>
<script type="module">
// Static imports on purpose. With `await import(...)` at the top level the
// module settles after the load event, so --dump-dom raced it and captured
// "PENDING" about half the time. They bought nothing either: the try/catch
// below starts after them, so an import failure was never caught by it.
import { compileForm } from "../../src/pytypehintweb/static/form.js";
import { expandPlan } from "../js/plan-fixture.mjs";

const log = [];
let failed = 0;
function check(name, cond) {
    log.push(`${cond ? "ok  " : "FAIL"}  ${name}`);
    if (!cond) failed++;
}
function threw(fn) { try { fn(); return false; } catch { return true; } }

try {
    const plan = expandPlan({
        kind: "form", name: "smoke",
        fields: [
            { name: "day", label: "Day", node: { kind: "date" } },
            { name: "at", label: "At", node: { kind: "time" } },
            { name: "level", label: "Level",
              node: { kind: "int", options: { slider: true, min: 0, max: 10, step: 2 } } },
            { name: "reach", label: "Reach",
              node: { kind: "int", options: {
                  slider: true, min: 1, max: 100, step: 5, showValue: true } } },
            { name: "nick", label: "Nick", optional: true, enabled: false,
              node: { kind: "str" } },
            { name: "who", label: "Who", node: {
                kind: "choice", branches: [
                    { value: "str", mode: "plain", node: { kind: "str" } },
                    { value: "int", mode: "plain", node: { kind: "int" } },
                    { value: "flt", mode: "plain", node: { kind: "float" } },
                ] } },
            { name: "tags", label: "Tags", node: {
                kind: "list", item: { kind: "str" } } },
            { name: "doc", label: "Doc", node: {
                kind: "file", options: { multiple: true } } },
            { name: "kept", label: "Kept", hasDefault: true,
              default: "stored/report.pdf",
              node: { kind: "file", options: { extensions: [".pdf"] } } },
            { name: "keptMany", label: "Kept many", hasDefault: true,
              default: ["stored/one.pdf", "stored/two.pdf"],
              node: { kind: "file",
                      options: { multiple: true, extensions: [".pdf"] } } },
            // A file composes like any other node; these four shapes are the
            // ones the Python adapter used to refuse outright.
            { name: "holes", label: "Holes", hasDefault: true,
              default: ["stored/a.pdf", null],
              node: { kind: "list",
                      item: { kind: "optional", node: { kind: "file",
                                                        options: {} } } } },
            { name: "mixed", label: "Mixed", hasDefault: true,
              default: [{ branch: 0, value: "stored/b.pdf" },
                        { branch: 1, value: 7 }],
              node: { kind: "list", item: { kind: "choice", branches: [
                  { value: "str", mode: "plain",
                    node: { kind: "file", options: {} } },
                  { value: "int", mode: "plain", node: { kind: "int" } },
              ] } } },
            { name: "nested", label: "Nested", hasDefault: true,
              default: [["stored/c.pdf"], ["stored/d.pdf", "stored/e.pdf"]],
              node: { kind: "list",
                      item: { kind: "list",
                              item: { kind: "file", options: {} } } } },
            // Byte bounds: a real File carries a real .size, which is the one
            // thing about it this layer can weigh.
            { name: "weighed", label: "Weighed", node: {
                kind: "file", options: {
                    extensions: [".pdf"], minSize: 10, maxSize: 100 } } },
            { name: "weighedKept", label: "Weighed kept", hasDefault: true,
              default: "stored/opaque.pdf",
              node: { kind: "file", options: {
                  extensions: [".pdf"], minSize: 10, maxSize: 100 } } },
            { name: "rows", label: "Rows", hasDefault: true,
              default: [{ title: "one", document: "stored/f.pdf" }],
              node: { kind: "list", item: { kind: "object", fields: [
                  { name: "title", node: { kind: "str" } },
                  { name: "document", node: { kind: "file", options: {} } },
              ] } } },
        ],
    });

    const form = compileForm(plan);
    const host = document.getElementById("host");
    for (const field of form.fields) host.append(field.widget.el);
    const by = (n) => form.fields.find((f) => f.name === n).widget;

    // native control types
    check("date is a native date input", by("day").widget.input.type === "date");
    check("time is a native time input", by("at").widget.input.type === "time");
    check("time exposes seconds (step=1)", by("at").widget.input.getAttribute("step") === "1");
    check("slider is a native range input", by("level").widget.input.type === "range");

    // date / time assignment
    by("day").widget.setValue("2026-07-22");
    check("date setValue round-trips", by("day").widget.value() === "2026-07-22");
    check("date rejects an impossible calendar date",
          threw(() => by("day").widget.setValue("2026-02-31")));
    check("date keeps its value after a rejected setValue",
          by("day").widget.value() === "2026-07-22");
    by("at").widget.setValue("14:30:05");
    check("time setValue round-trips", by("at").widget.value() === "14:30:05");

    // integer slider grid
    const slider = by("level").widget;
    slider.setValue(4);
    check("slider accepts an on-grid value", slider.value() === 4);
    check("slider rejects an off-grid value", threw(() => slider.setValue(3)));
    check("slider rejects an out-of-range value", threw(() => slider.setValue(12)));
    check("slider keeps its value after a rejected setValue", slider.value() === 4);

    // the maximum is a position even when the stride cannot land on it: only a
    // real browser proves the native range input actually reaches its far end
    const reach = by("reach").widget;
    const range = reach.control();
    range.value = range.max;
    range.dispatchEvent(new Event("input"));
    check("an off-grid slider reaches its maximum", reach.value() === 100);
    check("its readout shows the value, not the index",
          reach.readout.textContent === "100");
    check("it announces the value to a screen reader",
          range.getAttribute("aria-valuetext") === "100");
    reach.setValue(96);
    check("the step below the maximum is the last full stride",
          reach.value() === 96);
    check("a value between the last stride and the maximum is refused",
          threw(() => reach.setValue(98)));

    // optional toggle
    const nick = by("nick");
    check("optional starts disabled -> reads null", form.read().nick === null);
    nick.setEnabled(true);
    nick.widget.setValue("Ada");
    check("optional enabled + assigned reads the value", form.read().nick === "Ada");

    // union navigation + focus at the extreme (only a real browser drops focus
    // from a disabled control, so this is the check the fake DOM cannot make)
    const who = by("who").widget;
    check("union starts on branch 0", who.activeIndex() === 0);
    who.next.focus();
    who.next.click();
    check("union moves to branch 1", who.activeIndex() === 1);
    who.next.click();
    check("union reaches the last branch", who.activeIndex() === 2);
    check("next disables itself at the last branch", who.next.disabled === true);
    check("focus moved off the disabled next to previous",
          document.activeElement === who.previous);
    check("focus did NOT fall back to the body",
          document.activeElement !== document.body);

    // dynamic list
    const list = by("tags").widget;
    const before = list.items.length;
    list.addButton.click();
    check("list add grows the rows", list.items.length === before + 1);
    list.items[0].widget.setValue("x");
    check("list read reflects the row", form.read().tags[0] === "x");

    // file widget accessible name
    const file = by("doc").widget;
    check("file add button has a descriptive name",
          file.addBtn.getAttribute("aria-label") === "Add file");

    // a file default is an existing reference: shown as the current file, ready,
    // and with nothing local behind it
    const kept = by("kept").widget;
    check("a file default arrives as the widget's value",
          kept.value() === "stored/report.pdf");
    check("a file default is not a local selection",
          kept.file() === null && kept.files().length === 0);
    check("a file default has nothing to upload", kept.uploads().length === 0);
    check("a file default shows on screen as the current file",
          kept.el.textContent.includes("stored/report.pdf"));
    check("a defaulted file field is ready", kept.isReady());


    // A file composes recursively: these four shapes used to be refused
    // outright. Checked before any local pick, so uploads() is still empty.
    const same = (got, want) => JSON.stringify(got) === JSON.stringify(want);

    check("a list of optional files reads its holes",
          same(form.read().holes, ["stored/a.pdf", null]));
    check("a list of file-or-int rows reads both branches",
          same(form.read().mixed, ["stored/b.pdf", 7]));
    check("a nested list keeps both levels",
          same(form.read().nested,
               [["stored/c.pdf"], ["stored/d.pdf", "stored/e.pdf"]]));
    check("a list of groups reads a file per row",
          same(form.read().rows, [{ title: "one", document: "stored/f.pdf" }]));

    check("no deep default counts as an upload", form.uploads().length === 0);
    check("every deeply defaulted field is ready",
          ["holes", "mixed", "nested", "rows"].every((n) => by(n).isReady()));
    check("no deeply defaulted field is in error",
          ["holes", "mixed", "nested", "rows"].every((n) => !by(n).hasError()));

    // A real pick two levels down, with a real File: the only upload there is.
    const deep = new DataTransfer();
    deep.items.add(new File(["bytes"], "deep.pdf", { type: "application/pdf" }));

    const innerFile = by("nested").widget.widgets()[0].widgets()[0];
    innerFile.control().files = deep.files;
    innerFile.control().dispatchEvent(new Event("change"));

    check("a pick inside a nested list is found as an upload",
          form.uploads().length === 1
          && form.uploads()[0].file.name === "deep.pdf");
    check("the untouched rows keep their references",
          same(form.read().rows, [{ title: "one", document: "stored/f.pdf" }]));

    // Byte bounds, weighed against genuine File objects. A DataTransfer is the
    // only way to build one here, and the only way to hand it to a read-only
    // FileList.
    const weighed = by("weighed").widget;

    function pick(widget, name, bytes) {
        const transfer = new DataTransfer();
        transfer.items.add(new File(["x".repeat(bytes)], name,
                                    { type: "application/pdf" }));
        widget.control().files = transfer.files;
        widget.control().dispatchEvent(new Event("change"));
    }

    pick(weighed, "small.pdf", 9);
    check("a file below minSize is refused", weighed.hasError()
          && !weighed.isReady() && weighed.uploads().length === 0);

    pick(weighed, "big.pdf", 101);
    check("a file above maxSize is refused", weighed.hasError()
          && !weighed.isReady() && weighed.uploads().length === 0);

    pick(weighed, "edge-min.pdf", 10);
    check("exactly minSize is accepted",
          !weighed.hasError() && weighed.isReady());

    pick(weighed, "edge-max.pdf", 100);
    check("exactly maxSize is accepted",
          !weighed.hasError() && weighed.isReady());
    check("an accepted file becomes the one pending upload",
          weighed.uploads().length === 1
          && weighed.uploads()[0].file.name === "edge-max.pdf");

    check("a bounded reference is never weighed",
          !by("weighedKept").hasError() && by("weighedKept").isReady()
          && by("weighedKept").widget.uploads().length === 0);

    // Replacing it with a real local pick swaps both the value and the state.
    // `input.files` is a read-only FileList in a real browser, so the pick is
    // staged through DataTransfer — which is also the only way to get a genuine
    // File object here, and the fake DOM cannot.
    const transfer = new DataTransfer();
    transfer.items.add(new File(["bytes"], "replacement.pdf",
                                { type: "application/pdf" }));
    kept.input.files = transfer.files;
    kept.input.dispatchEvent(new Event("change"));

    check("picking a file replaces the defaulted reference",
          kept.value() !== "stored/report.pdf" && kept.value().endsWith(".pdf"));
    check("a picked file is local and pending",
          kept.files().length === 1 && kept.uploads().length === 1);

    // a list[File] default lands as a multiple selection of existing references
    const many = by("keptMany").widget;
    check("a list default keeps its references in order",
          JSON.stringify(many.value())
          === JSON.stringify(["stored/one.pdf", "stored/two.pdf"]));
    check("a list default holds no local files",
          many.files().length === 0 && many.uploads().length === 0);
    check("a list default shows both current files",
          many.el.textContent.includes("stored/one.pdf")
          && many.el.textContent.includes("stored/two.pdf"));
    check("a list default keeps read() in order",
          JSON.stringify(form.read().keptMany)
          === JSON.stringify(["stored/one.pdf", "stored/two.pdf"]));

    // showErrors does not throw and does not alter read()
    form.showErrors();
    check("showErrors runs without throwing", true);

    // union plain-branch transport with a real value (active branch is float)
    who.active().setValue(1.5);
    check("union plain branch transports the bare value", form.read().who === 1.5);

    // final read shape
    const out = form.read();
    check("read returns every field key",
          ["day", "at", "level", "nick", "who", "tags", "doc"].every((k) => k in out));
    check("read reports the slider number", out.level === 4);

    document.getElementById("out").textContent = log.join("\n");
    document.getElementById("result").textContent =
        failed === 0 ? `SMOKE: PASS (${log.length} checks)` : `SMOKE: FAIL (${failed})`;
} catch (error) {
    document.getElementById("out").textContent =
        log.join("\n") + "\n\nEXCEPTION: " + error.stack;
    document.getElementById("result").textContent = "SMOKE: FAIL (exception)";
}
</script>
</body>
</html>
