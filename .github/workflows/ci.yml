name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (mypy + suite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Node is on PATH so the star round-trip Python tests actually run
      # instead of skipping (they shell out to node; see tests/python/conftest.py).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # test extra = pytest + mypy; demo extra = fastapi + uvicorn, which
      # test_demo.py imports at collection time. The runtime dep pytypehint>=1.0.0
      # resolves from PyPI.
      - run: uv pip install --system -e ".[test,demo]"
      - run: mypy
      # pytest runs the whole Python suite, packaging/assets test included.
      - run: pytest

  javascript:
    name: JavaScript (suite + size + browser smoke + theme cascade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The JS suite runs purely in Node against the shipped static modules and
      # the test fixtures; it needs neither Python nor the installed package.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Covers the JS widgets, the size budget (size.test.mjs) and the plan-doc
      # examples (documentation.test.mjs).
      - run: node --test "tests/js/*.test.mjs"
      # Real-browser smoke against tests/browser/smoke.html, using the Chrome
      # pre-installed on ubuntu-latest. --no-sandbox is required on the runner.
      # The page prints "SMOKE: PASS (N checks)" into #result; fail the step
      # unless that verdict is present.
      # The verdict is read from the #result element, never from a bare text
      # match: both pages document their own PASS string in a comment, so an
      # unanchored grep would report success whatever the page did.
      - name: Browser smoke (headless Chrome)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --allow-file-access-from-files --virtual-time-budget=8000 \
            --dump-dom "file://$PWD/tests/browser/smoke.html" > smoke.out
          grep -o 'id="result">SMOKE: [A-Z]* ([0-9]* checks)' smoke.out | head -1
          if ! grep -q 'id="result">SMOKE: PASS' smoke.out; then
            echo "::error::browser smoke did not reach a PASS verdict"
            cat smoke.out
            exit 1
          fi
      # The theme contract of widgets.css needs a real cascade — specificity,
      # inheritance and proximity — which the text assertions in the Python suite
      # cannot reach. The page is static (no modules), and it runs once per system
      # preference so the automatic mode is covered both ways: 0 is dark, 1 light.
      - name: Theme contract (headless Chrome, both system preferences)
        run: |
          for scheme in 0 1; do
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --allow-file-access-from-files --virtual-time-budget=8000 \
              --blink-settings=preferredColorScheme=$scheme \
              --dump-dom "file://$PWD/tests/browser/theme.html" > theme.out
            grep -o 'id="result">THEME: [A-Z]* ([0-9]* checks)' theme.out | head -1
            if ! grep -q 'id="result">THEME: PASS' theme.out; then
              echo "::error::theme contract failed with preferredColorScheme=$scheme"
              cat theme.out
              exit 1
            fi
          done

  packaging:
    name: Packaging (build + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # __version__ is a plain literal, so the build reads it without importing
      # the package (no pytypehint needed just to build wheel + sdist).
      - run: uv build
      - run: uvx twine check dist/*
